name: Build C++ App

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile source
        run: >
          cl.exe /nologo /EHsc /std:c++17 /O2 /W3
          /Fe:VimiumApp.exe
          main.cpp
          /link user32.lib gdi32.lib ole32.lib oleaut32.lib uiautomationcore.lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VimiumApp
          path: VimiumApp.exe
